<ion-header [translucent]="true">
  <ion-toolbar>

  <ion-item lines="none">
    <ion-label 
      style="font-weight: 800; font-size: 3em;">
      Hoje
      <p style="font-weight: 400; color: #433464">
        {{ hoje | date: 'fullDate' }}
      </p>
    </ion-label>
  </ion-item>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  



  <ion-card class="ion-margin" *ngFor="let item of tarefasLista; let i=index">
    <ion-card-header>
      <ion-card-subtitle>
        <ion-icon [color]="item.prioridade === 'alto' ? 'danger':(item.prioridade ==='medio' ? 'warning': 'success' )" name="ellipse">   
        </ion-icon>
        <strong>
          {{item.categoria | uppercase}}
        </strong>
      </ion-card-subtitle>

    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label [color]="item.prioridade === 'alto' ? 'danger':(item.prioridade ==='medio' ? 'warning': 'success' )">
          <strong>
            {{item.nome | uppercase}}
          </strong>
        </ion-label>
      </ion-item>
      {{item.data | date: 'fullDate'}}
    </ion-card-content>
    <ion-row>
      <ion-item lines="nome" (click)="editar(item)">
        <ion-icon color="primary" name="create"></ion-icon>
        <ion-label>Editar</ion-label>
      </ion-item>

      <ion-item lines="nome" (click)="deletar(item.id)">
        <ion-icon color="danger" name="trash"></ion-icon>
        <ion-label>Cancelar</ion-label>
      </ion-item>
    </ion-row>

  </ion-card>

    <ion-fab vertical="top" horizontal="end" slot="fixed">
      <ion-fab-button (click)="adicionar()">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>


</ion-content>
